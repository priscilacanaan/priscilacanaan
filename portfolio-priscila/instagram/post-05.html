<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#0E0E12;color:#F5F4F0;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.45),transparent 60%);right:-300px;top:-300px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(0,194,168,.35),transparent 60%);left:-250px;bottom:-250px}
.wrap{position:relative;height:100%;padding:90px;display:flex;flex-direction:column;justify-content:space-between}
.top{font-family:'Space Grotesk';font-weight:700;font-size:30px}
.top span{color:#00C2A8}
.badge{display:inline-block;font-family:'Space Grotesk';font-weight:700;font-size:34px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,#7C5CFF,#00C2A8);color:#0E0E12;padding:18px 34px;border-radius:999px}
.tip{font-family:'Space Grotesk';font-weight:700;font-size:112px;line-height:1.02;letter-spacing:-3px;margin-top:40px}
.tip em{font-style:normal;background:linear-gradient(90deg,#7C5CFF,#00C2A8);-webkit-background-clip:text;background-clip:text;color:transparent}
.tip-big{font-family:'Space Grotesk';font-weight:700;font-size:118px;line-height:1;letter-spacing:-3px;margin-top:40px}
p{font-size:42px;line-height:1.35;color:#C9C6D0;max-width:860px;margin-top:34px}
.foot{font-family:'Space Grotesk';font-size:30px;color:#8E8E9A;display:flex;justify-content:space-between}
.foot b{color:#F5F4F0}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="wrap">
 <div class="top">priscila<span>.</span>canaan</div>
 <div><div class="badge">Tip · Systems</div><div class="tip">Build a system, not a one-off task.</div><p>If you do it twice, write the steps. If you do it ten times, automate it.</p></div>
 <div class="foot"><span></span><b>AI · Systems · Web · Media</b></div>
</div></body></html>
