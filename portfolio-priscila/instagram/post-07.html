<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#0E0E12;color:#F5F4F0;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.45),transparent 60%);right:-300px;top:-300px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(0,194,168,.35),transparent 60%);left:-250px;bottom:-250px}
.wrap{position:relative;height:100%;padding:90px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;font-family:'Space Grotesk';font-weight:700;font-size:30px}
.top span:last-child{color:#00C2A8}
.tag{font-family:'Space Grotesk';font-size:28px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#00C2A8}
h1{font-family:'Space Grotesk';font-weight:700;font-size:118px;line-height:1;letter-spacing:-3px;margin-top:24px}
p{font-size:42px;line-height:1.35;color:#C9C6D0;max-width:860px;margin-top:34px}
.foot{font-family:'Space Grotesk';font-size:30px;color:#8E8E9A;display:flex;justify-content:space-between}
.foot b{color:#F5F4F0}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="wrap">
 <div class="top"><span>priscila.canaan</span><span>07/09</span></div>
 <div><div class="tag">Tip · Web</div><h1>Tip #5</h1><p>Mobile first, always.</p></div>
 <div class="foot"><span>Most visitors will land on your site from their phone. Design there first.</span><b>AI · Websites · Media</b></div>
</div></body></html>
